<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目详情 — 玉国代码</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#050A18;
    --bg-2:#081026;
    --panel:#0B1530;
    --panel-2:#0A1228;
    --line:#16244A;
    --line-soft:#101C3D;
    --text:#E8EEFF;
    --muted:#8FA3D8;
    --accent:#4D8DFF;
    --accent-deep:#2E6BFF;
    --cyan:#35D6F5;
    --purple:#A78BFA;
    --green:#34D399;
    --orange:#FFA94D;
    --red:#FF6B6B;
    --gray:#6B7280;
    --radius:14px;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--sans);
    background:var(--bg);color:var(--text);line-height:1.6;
    min-height:100vh;display:flex;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  /* ===== 侧栏 ===== */
  .sidebar{
    width:260px;flex:none;
    background:var(--bg-2);
    border-right:1px solid var(--line-soft);
    padding:28px 22px;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;margin-bottom:40px}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    display:flex;align-items:center;justify-content:center;
    color:#061030;font-family:var(--mono);font-weight:600;font-size:15px;
  }
  .user-card{
    background:var(--panel);border:1px solid var(--line-soft);
    border-radius:12px;padding:18px 16px;margin-bottom:28px;
  }
  .user-card .avatar{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--cyan));
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:18px;color:#061030;margin-bottom:12px;
  }
  .user-card .uname{font-size:15px;font-weight:700}
  .user-card .uphone{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:4px;word-break:break-all}
  .nav-menu{display:flex;flex-direction:column;gap:4px;flex:1}
  .nav-menu a{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;border-radius:9px;
    font-size:14.5px;color:var(--muted);transition:all .2s;
  }
  .nav-menu a:hover{background:var(--panel);color:var(--text)}
  .nav-menu a.active{background:linear-gradient(135deg,rgba(77,141,255,.2),rgba(46,107,255,.12));color:var(--accent)}
  .logout{
    margin-top:auto;padding:11px 14px;border-radius:9px;
    font-size:14px;color:var(--muted);
    border:1px solid var(--line-soft);background:transparent;cursor:pointer;
    transition:all .2s;
  }
  .logout:hover{border-color:var(--red);color:#FF9E9E}

  /* ===== 主区 ===== */
  .main{flex:1;padding:44px 48px 80px;overflow-y:auto;max-width:100%}
  .back{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--muted);font-size:13.5px;margin-bottom:18px;
    transition:color .2s;
  }
  .back:hover{color:var(--accent)}

  .project-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:24px;margin-bottom:6px;flex-wrap:wrap;
  }
  .project-head .title{
    font-size:32px;font-weight:900;letter-spacing:.5px;
    overflow:hidden;text-overflow:ellipsis;max-width:680px;
  }
  .project-head .sub{
    font-family:var(--mono);font-size:13px;color:var(--muted);
    margin-top:4px;
  }
  .status-badge{
    font-family:var(--mono);font-size:13px;font-weight:600;
    padding:6px 14px;border-radius:999px;flex:none;
    background:rgba(255,255,255,.06);
    border:1px solid currentColor;
    align-self:center;
  }

  /* ===== 信息块 ===== */
  .block{
    background:linear-gradient(160deg,var(--panel) 0%,var(--panel-2) 100%);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:24px 26px;
    margin-top:18px;
  }
  .block-title{
    font-size:14px;font-weight:700;color:var(--muted);
    letter-spacing:1px;text-transform:uppercase;
    margin-bottom:14px;display:flex;align-items:center;gap:10px;
  }
  .block-title .accent{color:var(--cyan)}
  .meta-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px 22px;
  }
  .meta-item .label{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .meta-item .value{font-size:14.5px;font-weight:600;word-break:break-all}

  .desc-box{
    background:var(--bg);border:1px solid var(--line-soft);
    border-radius:10px;padding:14px 16px;
    font-size:14px;line-height:1.7;color:var(--text);
    white-space:pre-wrap;word-break:break-word;
  }

  /* ===== 附件图预览 ===== */
  .attach-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:10px;
  }
  .attach-grid a{
    display:block;aspect-ratio:1;
    border-radius:10px;overflow:hidden;
    border:1px solid var(--line-soft);
    background:var(--bg);
    transition:transform .2s,border-color .2s;
    position:relative;
  }
  .attach-grid a:hover{transform:scale(1.02);border-color:var(--accent)}
  .attach-grid img{
    width:100%;height:100%;object-fit:cover;
    display:block;
  }
  .attach-empty{
    font-size:13px;color:var(--muted);padding:6px 0;
  }

  /* ===== 时间线 ===== */
  .timeline{position:relative;padding-left:24px}
  .timeline::before{
    content:"";position:absolute;left:7px;top:8px;bottom:8px;
    width:2px;background:var(--line-soft);
  }
  .tl-item{position:relative;padding-bottom:18px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{
    content:"";position:absolute;left:-22px;top:6px;
    width:14px;height:14px;border-radius:50%;
    background:var(--bg);border:2px solid var(--cyan);
  }
  .tl-item.tl-staff::before{border-color:var(--accent)}
  .tl-item.tl-status::before{border-color:var(--orange)}
  .tl-item.tl-user::before{border-color:var(--green)}
  .tl-item .tl-head{
    display:flex;align-items:center;gap:10px;margin-bottom:6px;
  }
  .tl-item .tl-time{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tl-item .tl-by{
    font-family:var(--mono);font-size:11px;
    padding:1px 7px;border-radius:999px;
  }
  .tl-by.tl-by-staff{color:var(--accent);border:1px solid rgba(77,141,255,.3);background:rgba(77,141,255,.08)}
  .tl-by.tl-by-user{color:var(--green);border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
  .tl-by.tl-by-system{color:var(--orange);border:1px solid rgba(255,169,77,.3);background:rgba(255,169,77,.08)}
  .tl-item .tl-content{
    font-size:14px;color:var(--text);line-height:1.6;
    white-space:pre-wrap;word-break:break-word;
  }
  .tl-empty{font-size:13.5px;color:var(--muted);padding:4px 0}

  /* ===== 表单:追加需求 ===== */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
  .field textarea{
    width:100%;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:var(--sans);font-size:14.5px;
    padding:11px 14px;outline:none;
    transition:border-color .2s;
    min-height:100px;line-height:1.6;resize:vertical;
  }
  .field textarea:focus{border-color:var(--accent)}
  .field input[type="file"]{
    width:100%;font-size:13px;color:var(--muted);padding:8px 0;
  }
  .field input[type="file"]::file-selector-button{
    margin-right:10px;padding:6px 12px;
    background:var(--panel);border:1px solid var(--line);
    color:var(--text);border-radius:7px;cursor:pointer;
    font-family:var(--sans);font-size:13px;
  }
  .btn{
    padding:11px 22px;border-radius:10px;border:none;
    font-size:14.5px;font-weight:700;cursor:pointer;transition:all .2s;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    color:#04102E;
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(77,141,255,.4)}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
  .progress{
    font-family:var(--mono);font-size:12.5px;color:var(--muted);
    margin-top:8px;min-height:18px;
  }
  .progress.err{color:#FF9E8E}
  .progress.ok{color:var(--cyan)}

  .toast{
    position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:var(--panel);border:1px solid var(--cyan);color:var(--cyan);
    padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;
    z-index:100;opacity:0;
    transition:opacity .25s,transform .25s;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--red);color:#FF9E8E}

  .sync-info{
    font-family:var(--mono);font-size:12px;color:var(--muted);
    display:flex;align-items:center;gap:8px;margin-top:14px;
  }
  .sync-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--green);box-shadow:0 0 6px var(--green);
  }
  .sync-dot.syncing{background:var(--orange);box-shadow:0 0 6px var(--orange);animation:pulse 1s infinite}
  .sync-dot.error{background:var(--red);box-shadow:0 0 6px var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent)}

  @media (max-width:900px){
    .sidebar{width:220px;padding:22px 18px}
    .main{padding:32px 28px 80px}
    .project-head .title{font-size:26px}
  }
  @media (max-width:700px){
    body{flex-direction:column}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:14px 18px;height:auto;position:static;gap:12px;flex-wrap:wrap}
    .brand{margin-bottom:0;margin-right:8px}
    .user-card{margin-bottom:0;padding:8px 12px;display:flex;align-items:center;gap:10px}
    .user-card .avatar{width:32px;height:32px;font-size:14px;margin-bottom:0}
    .nav-menu{display:none}
    .logout{margin-top:0;padding:8px 12px;font-size:13px}
    .main{padding:24px 18px 80px}
    .block{padding:18px 18px}
  }
</style>
</head>
<body>

<aside class="sidebar">
  <a class="brand" href="index.html">
    <span class="brand-mark">&lt;/&gt;</span>
    <span>玉国代码</span>
  </a>
  <div class="user-card">
    <div class="avatar" id="avatar">U</div>
    <div class="uname" id="uname">未登录</div>
    <div class="uphone" id="uphone">—</div>
  </div>
  <nav class="nav-menu">
    <a href="dashboard.html">总览</a>
    <a href="dashboard.html" class="active">我的项目</a>
    <a href="#">我的文件仓库</a>
    <a href="#">交付成果</a>
    <a href="#">个人设置</a>
  </nav>
  <button class="logout" id="logout">退出登录</button>
</aside>

<main class="main">
  <a class="back" href="dashboard.html">← 返回控制台</a>

  <div class="project-head">
    <div>
      <div class="title" id="pr-title">加载中…</div>
      <div class="sub" id="pr-sub">// project detail</div>
    </div>
    <span class="status-badge" id="pr-status" style="color:var(--muted)">—</span>
  </div>

  <div class="sync-info">
    <span class="sync-dot" id="sync-dot"></span>
    <span id="sync-text">同步就绪</span>
  </div>

  <!-- 基础信息 -->
  <div class="block">
    <div class="block-title"><span class="accent">//</span> 基础信息</div>
    <div class="meta-grid">
      <div class="meta-item"><div class="label">项目 ID</div><div class="value" id="m-id">—</div></div>
      <div class="meta-item"><div class="label">关联申请</div><div class="value" id="m-apply">—</div></div>
      <div class="meta-item"><div class="label">创建时间</div><div class="value" id="m-create">—</div></div>
      <div class="meta-item"><div class="label">联系方式</div><div class="value" id="m-contact">—</div></div>
    </div>
  </div>

  <!-- 原始需求 -->
  <div class="block">
    <div class="block-title"><span class="accent">//</span> 原始需求描述</div>
    <div class="desc-box" id="m-desc">—</div>
  </div>

  <!-- 客服备注 -->
  <div class="block" id="remark-block">
    <div class="block-title"><span class="accent">//</span> 客服备注</div>
    <div id="remark-current"></div>
    <div class="timeline" id="remark-history"></div>
  </div>

  <!-- 附件图片 -->
  <div class="block">
    <div class="block-title"><span class="accent">//</span> 项目附件 <span id="attach-count" style="color:var(--muted);font-family:var(--mono);font-size:12px;margin-left:8px"></span></div>
    <div class="attach-grid" id="attach-grid"></div>
  </div>

  <!-- 动态日志 -->
  <div class="block">
    <div class="block-title"><span class="accent">//</span> 项目日志</div>
    <div class="timeline" id="timeline"></div>
  </div>

  <!-- 追加需求 -->
  <div class="block">
    <div class="block-title"><span class="accent">//</span> 追加需求 / 反馈</div>
    <form id="add-form">
      <div class="field">
        <textarea id="ad-content" maxlength="2000" placeholder="有新的想法、补充需求、修改意见,写在这里。提交后客服会看到你的留言。"></textarea>
      </div>
      <div class="field">
        <label style="font-size:13.5px">补充附件(可选)</label>
        <input type="file" id="ad-files" multiple accept="image/*">
      </div>
      <button type="submit" class="btn btn-primary" id="ad-submit">追加需求</button>
      <div class="progress" id="ad-progress"></div>
    </form>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="github-api.js"></script>
<script src="project_detail.js"></script>
</body>
</html>
