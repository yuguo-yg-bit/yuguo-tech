<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 — 玉国代码</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#050A18;
    --bg-2:#081026;
    --panel:#0B1530;
    --line:#16244A;
    --line-soft:#101C3D;
    --text:#E8EEFF;
    --muted:#8FA3D8;
    --accent:#4D8DFF;
    --accent-deep:#2E6BFF;
    --cyan:#35D6F5;
    --radius:16px;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--sans);
    background:var(--bg);color:var(--text);line-height:1.6;
    min-height:100vh;display:flex;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* ===== 左栏：代码图 + 介绍 ===== */
  .left{
    flex:1.1;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    padding:60px 56px;
  }
  .left-bg{
    position:absolute;inset:0;
    background-image:url("https://aka.doubaocdn.com/s/529fyVR3Kt");
    background-size:cover;background-position:center;
    filter:brightness(.55) saturate(.85);
  }
  .left-bg::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(5,10,24,.55) 0%,rgba(5,10,24,.82) 100%);
  }
  .left-inner{position:relative;z-index:1;max-width:480px}
  .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:900;font-size:19px;margin-bottom:48px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    display:flex;align-items:center;justify-content:center;
    color:#061030;font-family:var(--mono);font-weight:600;font-size:15px;
  }
  .left h1{
    font-size:46px;font-weight:900;letter-spacing:2px;line-height:1.2;
    background:linear-gradient(180deg,#fff 20%,#A9C8FF 70%,#5B8FFF);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .left .sub{
    margin-top:14px;font-family:var(--mono);font-size:14px;color:var(--cyan);
    letter-spacing:1px;
  }
  .left ul{
    margin-top:36px;list-style:none;
    display:flex;flex-direction:column;gap:16px;
  }
  .left ul li{
    display:flex;align-items:center;gap:12px;
    font-size:15.5px;color:var(--text);
  }
  .left ul li .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 10px var(--cyan);flex:none;
  }
  .left .foot{
    margin-top:56px;font-family:var(--mono);font-size:12.5px;color:var(--muted);
  }

  /* ===== 右栏：表单 ===== */
  .right{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:40px;background:var(--bg-2);
  }
  .form-box{width:100%;max-width:400px}
  .tabs{
    display:flex;background:var(--panel);
    border:1px solid var(--line-soft);border-radius:12px;
    padding:4px;margin-bottom:32px;
  }
  .tab{
    flex:1;text-align:center;padding:11px;
    font-size:15px;font-weight:700;color:var(--muted);
    border-radius:9px;cursor:pointer;
    transition:all .2s;border:none;background:transparent;
  }
  .tab.active{
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    color:#04102E;
  }
  .field{margin-bottom:18px}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
  .field input{
    width:100%;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:var(--sans);font-size:15px;
    padding:13px 15px;outline:none;
    transition:border-color .2s;
  }
  .field input:focus{border-color:var(--accent)}
  .field .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  .btn{
    width:100%;padding:14px;border-radius:10px;border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    color:#04102E;font-size:15.5px;font-weight:700;
    cursor:pointer;transition:box-shadow .2s,transform .15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(77,141,255,.4)}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .msg{margin-top:14px;font-size:13.5px;min-height:20px}
  .msg.err{color:#FF9E9E}
  .msg.ok{color:var(--cyan)}

  /* 滑块验证 */
  .captcha{
    margin-bottom:18px;
  }
  .captcha-track{
    position:relative;height:44px;
    background:var(--bg);
    border:1px solid var(--line);border-radius:10px;
    overflow:hidden;user-select:none;
  }
  .captcha-track .text{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--muted);letter-spacing:1px;
  }
  .captcha-fill{
    position:absolute;left:0;top:0;height:100%;width:0;
    background:rgba(77,141,255,.18);border-right:2px solid var(--accent);
  }
  .captcha-handle{
    position:absolute;left:0;top:3px;width:38px;height:38px;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    border-radius:8px;cursor:grab;
    display:flex;align-items:center;justify-content:center;
    color:#04102E;font-weight:700;font-size:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .captcha-handle:active{cursor:grabbing}
  .captcha.passed .captcha-track{border-color:var(--cyan)}
  .captcha.passed .captcha-fill{background:rgba(53,214,245,.2)}
  .captcha.passed .text{color:var(--cyan)}

  @media (max-width:860px){
    body{flex-direction:column}
    .left{padding:40px 28px;min-height:auto}
    .left h1{font-size:34px}
    .left ul{margin-top:24px}
    .right{padding:32px 24px}
  }
</style>
</head>
<body>

<!-- ===== 左栏 ===== -->
<div class="left">
  <div class="left-bg"></div>
  <div class="left-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">&lt;/&gt;</span>
      <span>玉国信息科技</span>
    </a>
    <h1>欢迎登录 / 注册<br>玉国代码</h1>
    <div class="sub">// login &amp; register</div>
    <ul>
      <li><span class="dot"></span>承接事务：需求提交、进度跟踪、交付管理</li>
      <li><span class="dot"></span>11 种主流语言，按项目选型</li>
      <li><span class="dot"></span>6 大平台，一次开发全端可用</li>
      <li><span class="dot"></span>多种方案化需求，透明报价</li>
    </ul>
    <div class="foot">© 2026 Yuguo Info Tech</div>
  </div>
</div>

<!-- ===== 右栏：登录/注册 ===== -->
<div class="right">
  <div class="form-box">
    <div class="tabs">
      <button class="tab active" data-mode="login">登录</button>
      <button class="tab" data-mode="register">注册</button>
    </div>

    <form id="auth-form">
      <div class="field">
        <label>手机号</label>
        <input id="phone" type="tel" placeholder="请输入手机号" maxlength="11">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="password" type="password" placeholder="请输入密码">
      </div>
      <div class="field" id="confirm-field" style="display:none">
        <label>确认密码</label>
        <input id="confirm" type="password" placeholder="再次输入密码">
      </div>
      <div class="captcha" id="captcha" style="display:none">
        <label>人机验证</label>
        <div class="captcha-track" id="captcha-track">
          <div class="captcha-fill" id="captcha-fill"></div>
          <span class="text" id="captcha-text">拖动滑块完成验证</span>
          <div class="captcha-handle" id="captcha-handle">→</div>
        </div>
      </div>
      <button class="btn" id="submit-btn" type="submit">登录</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<script>
/* ===== 配置片段（与首页一致） ===== */
var _ks1 = "vzKu69L/Og9muJ";
var _kv  = "EgajaMIrPJPtNBd0";
var _ks2 = "1dJdIcOcv1V2fz";
var _kp  = "yuguo-site-2026-secret-key";
var _ks3 = "9KIFrDxu61lnZP";
var _kt  = "3F2yaBX6xpOsstB8Kg6IIQ==";
var _ks4 = "EgvYMQdFvxiA==";

function _b64ToBuf(b64){
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++){ bytes[i] = bin.charCodeAt(i); }
  return bytes;
}
async function _getToken(){
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.digest('SHA-256', enc.encode(_kp));
  var key = await crypto.subtle.importKey('raw', keyMaterial, {name:'AES-GCM'}, false, ['decrypt']);
  var iv = _b64ToBuf(_kv);
  var ciphertext = _b64ToBuf(_ks1 + _ks2 + _ks3 + _ks4);
  var tag = _b64ToBuf(_kt);
  var combined = new Uint8Array(ciphertext.length + tag.length);
  combined.set(ciphertext, 0);
  combined.set(tag, ciphertext.length);
  var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, combined);
  return new TextDecoder().decode(plain);
}
async function _gh(token, method, url, body){
  var opts = {
    method: method,
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }
  };
  if(body){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  var res = await fetch('https://api.github.com' + url, opts);
  return res;
}
async function _sha256(text){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(function(b){
    return b.toString(16).padStart(2,'0');
  }).join('');
}

/* ===== 切换登录/注册 ===== */
var mode = 'login';
var tabs = document.querySelectorAll('.tab');
var confirmField = document.getElementById('confirm-field');
var captchaBox = document.getElementById('captcha');
var submitBtn = document.getElementById('submit-btn');
tabs.forEach(function(tab){
  tab.addEventListener('click', function(){
    tabs.forEach(function(t){ t.classList.remove('active'); });
    tab.classList.add('active');
    mode = tab.getAttribute('data-mode');
    confirmField.style.display = (mode === 'register') ? 'block' : 'none';
    captchaBox.style.display = (mode === 'register') ? 'block' : 'none';
    submitBtn.textContent = (mode === 'register') ? '注册' : '登录';
    setMsg('', '');
  });
});

function setMsg(text, type){
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg' + (type ? ' ' + type : '');
}

/* ===== 滑块验证 ===== */
var captchaPassed = false;
(function(){
  var track = document.getElementById('captcha-track');
  var handle = document.getElementById('captcha-handle');
  var fill = document.getElementById('captcha-fill');
  var text = document.getElementById('captcha-text');
  var startX = 0, curX = 0, dragging = false;

  function onStart(x){ dragging = true; startX = x; }
  function onMove(x){
    if(!dragging || captchaPassed) return;
    var max = track.offsetWidth - handle.offsetWidth;
    var dx = Math.min(Math.max(x - startX, 0), max);
    curX = dx;
    handle.style.left = dx + 'px';
    fill.style.width = dx + 'px';
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    var max = track.offsetWidth - handle.offsetWidth;
    if(curX >= max - 4){
      captchaPassed = true;
      document.getElementById('captcha').classList.add('passed');
      text.textContent = '验证通过';
      handle.textContent = '✓';
    } else {
      handle.style.left = '0px';
      fill.style.width = '0px';
      curX = 0;
    }
  }
  handle.addEventListener('mousedown', function(e){ onStart(e.clientX); });
  handle.addEventListener('touchstart', function(e){ onStart(e.touches[0].clientX); });
  document.addEventListener('mousemove', function(e){ onMove(e.clientX); });
  document.addEventListener('touchmove', function(e){ onMove(e.touches[0].clientX); });
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
})();

/* ===== 登录 / 注册 提交 ===== */
document.getElementById('auth-form').addEventListener('submit', async function(e){
  e.preventDefault();
  var phone = document.getElementById('phone').value.trim();
  var pwd = document.getElementById('password').value;
  var confirm = document.getElementById('confirm').value;

  if(!/^1\d{10}$/.test(phone)){ setMsg('请输入正确的 11 位手机号', 'err'); return; }
  if(pwd.length < 6){ setMsg('密码至少 6 位', 'err'); return; }
  if(mode === 'register'){
    if(pwd !== confirm){ setMsg('两次密码不一致', 'err'); return; }
    if(!captchaPassed){ setMsg('请先完成人机滑块验证', 'err'); return; }
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '请稍候…';
  setMsg('', '');

  try{
    var token = await _getToken();
    var pwdHash = await _sha256(phone + ':' + pwd);
    var userPath = 'users/' + phone + '/profile.json';

    if(mode === 'register'){
      /* 注册：检查是否已存在，再建用户文件夹 */
      var checkRes = await _gh(token, 'GET', '/repos/yuguo-yg-bit/yuguo-coding/contents/' + userPath);
      if(checkRes.ok){
        setMsg('该手机号已注册，请直接登录', 'err');
        submitBtn.disabled = false;
        submitBtn.textContent = '注册';
        return;
      }
      var profile = {
        phone: phone,
        passwordHash: pwdHash,
        createdAt: new Date().toISOString(),
        projects: []
      };
      var content = btoa(unescape(encodeURIComponent(JSON.stringify(profile, null, 2))));
      await _gh(token, 'PUT', '/repos/yuguo-yg-bit/yuguo-coding/contents/' + userPath, {
        message: '注册用户: ' + phone,
        content: content
      });
      setMsg('注册成功，正在进入控制台…', 'ok');
      setTimeout(function(){
        localStorage.setItem('yuguo_user', phone);
        location.href = 'dashboard.html';
      }, 800);
    } else {
      /* 登录：读取用户 profile 校验密码 */
      var res = await _gh(token, 'GET', '/repos/yuguo-yg-bit/yuguo-coding/contents/' + userPath);
      if(!res.ok){
        setMsg('用户不存在，请先注册', 'err');
        submitBtn.disabled = false;
        submitBtn.textContent = '登录';
        return;
      }
      var data = await res.json();
      var profile = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      if(profile.passwordHash !== pwdHash){
        setMsg('密码错误', 'err');
        submitBtn.disabled = false;
        submitBtn.textContent = '登录';
        return;
      }
      setMsg('登录成功，正在进入控制台…', 'ok');
      setTimeout(function(){
        localStorage.setItem('yuguo_user', phone);
        location.href = 'dashboard.html';
      }, 600);
    }
  }catch(err){
    setMsg('网络错误：' + err.message, 'err');
    submitBtn.disabled = false;
    submitBtn.textContent = (mode === 'register') ? '注册' : '登录';
  }
});
</script>

</body>
</html>
