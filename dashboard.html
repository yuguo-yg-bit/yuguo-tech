<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>控制台 — 玉国代码</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#050A18;
    --bg-2:#081026;
    --panel:#0B1530;
    --line:#16244A;
    --line-soft:#101C3D;
    --text:#E8EEFF;
    --muted:#8FA3D8;
    --accent:#4D8DFF;
    --accent-deep:#2E6BFF;
    --cyan:#35D6F5;
    --radius:16px;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--sans);
    background:var(--bg);color:var(--text);line-height:1.6;
    min-height:100vh;display:flex;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* ===== 侧栏 ===== */
  .sidebar{
    width:260px;flex:none;
    background:var(--bg-2);
    border-right:1px solid var(--line-soft);
    padding:28px 22px;
    display:flex;flex-direction:column;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:900;font-size:18px;margin-bottom:40px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    display:flex;align-items:center;justify-content:center;
    color:#061030;font-family:var(--mono);font-weight:600;font-size:15px;
  }
  .user-card{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:12px;
    padding:18px 16px;
    margin-bottom:28px;
  }
  .user-card .avatar{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--cyan));
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:18px;color:#061030;
    margin-bottom:12px;
  }
  .user-card .uname{font-size:15px;font-weight:700}
  .user-card .uphone{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:4px}
  .user-card .ulevel{
    display:inline-block;margin-top:10px;
    font-family:var(--mono);font-size:11px;color:var(--cyan);
    border:1px solid rgba(53,214,245,.3);background:rgba(53,214,245,.08);
    padding:2px 8px;border-radius:999px;
  }
  .nav-menu{display:flex;flex-direction:column;gap:4px;flex:1}
  .nav-menu a{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;border-radius:9px;
    font-size:14.5px;color:var(--muted);
    transition:all .2s;
  }
  .nav-menu a:hover{background:var(--panel);color:var(--text)}
  .nav-menu a.active{
    background:linear-gradient(135deg,rgba(77,141,255,.2),rgba(46,107,255,.12));
    color:var(--accent);
  }
  .logout{
    margin-top:auto;
    padding:11px 14px;border-radius:9px;
    font-size:14px;color:var(--muted);
    border:1px solid var(--line-soft);
    background:transparent;cursor:pointer;
    transition:all .2s;font-family:var(--sans);
  }
  .logout:hover{border-color:#FF6B6B;color:#FF9E9E}

  /* ===== 主区 ===== */
  .main{
    flex:1;padding:44px 48px;
    overflow-y:auto;
  }
  .main h1{
    font-size:30px;font-weight:900;letter-spacing:.5px;
    margin-bottom:8px;
  }
  .main .welcome{
    font-family:var(--mono);font-size:13.5px;color:var(--cyan);
    margin-bottom:36px;
  }
  .placeholder{
    border:1px dashed rgba(77,141,255,.35);
    border-radius:var(--radius);
    background:rgba(77,141,255,.04);
    padding:80px 40px;
    text-align:center;
    color:var(--muted);
  }
  .placeholder .big{
    font-family:var(--mono);font-size:48px;color:var(--accent);
    opacity:.5;margin-bottom:18px;display:block;
  }
  .placeholder p{font-size:15px}

  @media (max-width:800px){
    body{flex-direction:column}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:16px 20px}
    .brand{margin-bottom:0;margin-right:16px}
    .user-card{margin-bottom:0;margin-right:16px;padding:10px 14px;display:flex;align-items:center;gap:10px}
    .user-card .avatar{width:34px;height:34px;font-size:14px;margin-bottom:0}
    .nav-menu{display:none}
    .main{padding:28px 22px}
  }
</style>
</head>
<body>

<!-- ===== 侧栏 ===== -->
<aside class="sidebar">
  <a class="brand" href="index.html">
    <span class="brand-mark">&lt;/&gt;</span>
    <span>玉国代码</span>
  </a>

  <div class="user-card">
    <div class="avatar" id="avatar">U</div>
    <div class="uname" id="uname">未登录</div>
    <div class="uphone" id="uphone">—</div>
    <span class="ulevel">// 控制台</span>
  </div>

  <nav class="nav-menu">
    <a href="#" class="active">总览</a>
    <a href="#">我的需求</a>
    <a href="#">项目文件</a>
    <a href="#">账单与交付</a>
  </nav>

  <button class="logout" id="logout">退出登录</button>
</aside>

<!-- ===== 主区 ===== -->
<main class="main">
  <h1>控制台</h1>
  <div class="welcome" id="welcome">// welcome back</div>

  <div class="placeholder">
    <span class="big">&lt;/&gt;</span>
    <p>这里暂时留空，后续会展示你的项目进度、需求记录和交付物。</p>
  </div>
</main>

<script>
var phone = localStorage.getItem('yuguo_user');
if(!phone){
  location.href = 'login.html';
} else {
  document.getElementById('avatar').textContent = phone.slice(0,2);
  document.getElementById('uname').textContent = '用户 ' + phone.slice(0,3) + '****' + phone.slice(-2);
  document.getElementById('uphone').textContent = phone;
  document.getElementById('welcome').textContent = '// welcome back, ' + phone;
}
document.getElementById('logout').addEventListener('click', function(){
  localStorage.removeItem('yuguo_user');
  location.href = 'login.html';
});
</script>

</body>
</html>
